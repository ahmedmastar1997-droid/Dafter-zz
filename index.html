#tbl th:not(.nm),#tbl td:not(.nm){min-width:90px;height:46px}#tbl td input{width:100%;min-width:76px;box-sizing:border-box;text-align:center}#tbl td input.nt{min-width:170px}#tbl tr.pcr td{background:var(--pl);font-weight:700}

details.dg{border:1px solid var(--b);border-radius:12px;padding:2px 10px;margin:8px 0;background:var(--c)}details>summary{cursor:pointer;padding:9px 2px;list-style:none}details>summary::before{content:'◂ ';color:var(--p)}details[open]>summary::before{content:'▾ '}#pft{display:none}@media print{#ft{display:none!important}#pft{display:block;position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:12px}}body.fs #fsx{display:block}body.fs .wrap{position:fixed;inset:0;z-index:40;max-height:none;height:100%;border-radius:0;padding-top:50px}

<header><h1>📒 دفتر الدرجات الذكي</h1><select id="sx" aria-label="الشعبة"></select><button id=ubtn class="btn o s" data-a=undo title="تراجع">↩</button><button id=rbtn class="btn o s" data-a=redo title="إعادة">↪</button><small id="st"></small></header>
<div id="main"></div><div id="md"></div><div id="toast"></div><footer id="ft"></footer><div id="pft"></div><button id="fsx" class="btn" data-a="fs">✕ خروج من ملء الشاشة</button>
<nav class="nav"><button data-a="tab" data-t="home">الرئيسية</button><button data-a="tab" data-t="str">الصفوف</button><button data-a="tab" data-t="daily">اليومي</button><button data-a="tab" data-t="month">الشهري</button><button data-a="tab" data-t="stu">الوسطي</button><button data-a="tab" data-t="ours">طلابنا</button><button data-a="tab" data-t="set">الإعدادات</button></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4),fmt=v=>v==null||v===''?'':isNaN(v)?v:+(+v).toFixed(2);
const today=()=>new Date().toISOString().slice(0,10);
let S={classes:[],sections:[],students:[],cols:[],scores:{},log:[],cfg:{z:false,scale:100}},UI={tab:'home',sec:null,date:today(),mb:null},IDX=null;
/* storage */
const dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('gradebook',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
async function load(){try{const db=await dbp;return await new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
let tm;function save(){clearTimeout(tm);tm=setTimeout(async()=>{try{const db=await dbp;db.transaction('kv','readwrite').objectStore('kv').put(S,'state');$('#st').textContent='✓ محفوظ'}catch(e){$('#st').textContent='⚠ تعذر الحفظ'}},150)}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2500)}
function modal(h){$('#md').innerHTML='<div>'+h+'</div>';$('#md').classList.add('show');document.body.classList.add('mo')}
function closeM(){$('#md').classList.remove('show');document.body.classList.remove('mo');UI.mb=null;UI.cm=null;UI.tm=null}
function conf(msg,fn){window._cf=fn;window._cm=UI.cm;window._tm=UI.tm;modal(`<p>${msg}</p><div class=bar><button class="btn d" data-a="cfy">نعم، تأكيد</button><button class="btn o" data-a="x">إلغاء</button></div>`)}
/* helpers */
const sec=()=>S.sections.find(x=>x.id==UI.sec),col=id=>S.cols.find(c=>c.id==id),cols=(s,b)=>S.cols.filter(c=>c.sec==s&&c.book==b),studs=s=>S.students.filter(x=>x.sec==s&&!x.arch);
const secName=s=>{const c=S.classes.find(x=>x.id==s.cls);return(c?c.name:'')+' / '+s.name};
function idx(){if(IDX)return IDX;IDX={};for(const k in S.scores){if(k[0]!='d')continue;const[,c,s,d]=k.split('|');const vv=zv(S.scores[k]);if(vv==null)continue;(IDX[c+'|'+s]??=[]).push([d,vv]);if(col(c)&&!col(c).hidden){const q='tot:'+(col(c).rec||'r1')+'|'+s;IDX[q]??=[];let e=IDX[q].find(x=>x[0]==d);if(!e)IDX[q].push(e=[d,0]);e[1]+=vv}}for(const k in IDX)IDX[k].sort((a,b)=>a[0]<b[0]?-1:1);return IDX}
function src(c){if(!c.link||c.link==='none')return{cols:[]};if(c.link.startsWith('tot')){const r=c.link.split(':')[1]||'r1',q=recs(S.sections.find(x=>x.id==c.sec)).find(y=>y.id==r);return q?{cols:[{id:'tot:'+r,name:'مجموع '+q.name}],man:1}:{cols:[]}}if(c.link!='auto'){const x=col(c.link);return{cols:x?[x]:[],man:1}}const mt=(months(S.sections.find(x=>x.id==c.sec)).find(y=>y.id==c.book)||{}).t,m=cols(c.sec,'daily').filter(k=>k.name.trim()==c.name.trim()&&(recs(S.sections.find(x=>x.id==c.sec)).find(r=>r.id==(k.rec||'r1'))||{}).t==mt);return{cols:m.slice(0,1),dup:m.length>1}}
function agg(a,m){if(!a.length)return null;const v=a.map(x=>x[1]);const s=v.reduce((x,y)=>x+y,0);return m=='max'?Math.max(...v):m=='sum'?s:m=='avg'?s/v.length:v[v.length-1]}
function cell(c,st){if(c.book!='daily'){const s=src(c);if(s.cols.length){if(st.ent)return{v:null,l:1,src:s.cols[0]};const mo=(months(S.sections.find(x=>x.id==c.sec)).find(m=>m.id==c.book)||{}).mo;let a=idx()[s.cols[0].id+'|'+st.id]||[];if(mo)a=a.filter(x=>x[0].slice(0,7)==mo);const v=agg(a,c.agg);return{v:v==null?null:Math.round(v),l:1,src:s.cols[0]}}}const v=S.scores['m|'+c.id+'|'+st.id];return{v:zv(v),raw:v}}
function avg(st,b){let n=0,d=0;for(const c of cols(st.sec,b)){if(c.hidden||!(c.max>0))continue;const w=+c.w||1,x=cell(c,st).v;if(x==null){if(S.cfg.z)d+=w;continue}n+=x/c.max*w;d+=w}return d?Math.round(n/d*S.cfg.scale):null}
const months=s=>s.months??=[{id:'m1',name:'الشهر الأول',mo:s.m1||'',t:1},{id:'m2',name:'الشهر الثاني',mo:s.m2||'',t:1},{id:'m3',name:'الشهر الثالث',mo:'',t:2},{id:'m4',name:'الشهر الرابع',mo:'',t:2}];
const terms0=x=>{const ms=months(S.sections.find(s=>s.id==x.sec)),t=n=>{const v=ms.filter(m=>m.t==n).map(m=>avg(x,m.id)).filter(v=>v!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null},f1=t(1),f2=t(2),r=[f1,f2].filter(v=>v!=null);return{f1,mid:f1,f2,fin:r.length?r.reduce((a,b)=>a+b,0)/r.length:null}};
const avOf=(x,k)=>k=='fl'?flv(x):k.startsWith('tc:')?tcv(x,k.slice(3)):k.startsWith('avg:')?avg(x,k.slice(4)):null,sem=x=>{const v=Object.values(terms(x)).filter(q=>q!=null);return v.length?v[v.length-1]:null};
const dayTot=(x,d,cs)=>{let t=0,n=0;cs.forEach(c=>{const v=S.scores['d|'+c.id+'|'+x.id+'|'+d];const w=zv(v);if(w!=null){t+=w;n++}});return n?t:null};
function setS(k,v,meta){const o=S.scores[k];v=(v==='غائب'||v==='غش')?v:(v===''||v==null||isNaN(v))?null:+v;if((o??null)===v)return;if(v==null)delete S.scores[k];else S.scores[k]=v;S.log.unshift({t:Date.now(),o:o??null,n:v,k,...meta});if(S.log.length>5000)S.log.length=5000;IDX=null;save()}
/* views */
const V={};const nosec=()=>'<div class=card>أنشئ صفاً وشعبة أولاً من تبويب «الصفوف».</div>';
function secSel(){const x=$('#sx');x.innerHTML=S.sections.map(s=>`<option value="${s.id}" ${s.id==UI.sec?'selected':''}>${esc(secName(s))}</option>`).join('')||'<option>لا توجد شعب</option>'}
V.home=()=>{const st=S.students.filter(x=>!x.arch);let h=`<h2>لوحة التحكم</h2><div class=grid><div class=card><b>${S.classes.length}</b>صفوف</div><div class=card><b>${S.sections.length}</b>شعب</div><div class=card><b>${st.length}</b>طلاب</div><div class=card><b>${S.log.length}</b>تعديلات مسجلة</div></div>`;
if(!S.sections.length)return h+nosec();const ss=studs(UI.sec),r=ss.map(s=>({s,v:sem(s)})).filter(x=>x.v!=null).sort((a,b)=>b.v-a.v);
h+=`<div class=card><b>${esc(secName(sec()))}</b><br>عدد الطلاب: ${ss.length}<br>متوسط الشعبة (فصلي): ${r.length?fmt(r.reduce((a,b)=>a+b.v,0)/r.length):'—'}<br>دون ٥٠٪: ${r.filter(x=>x.v<S.cfg.scale/2).length}</div>`;

const INS=`<details class=dg><summary>١) ⚠️ حماية بياناتك (الأهم)</summary><ol><li>البيانات تُحفظ تلقائياً في متصفحك ولا تُرسل لأحد.</li><li>احفظ نسخة احتياطية كملف دورياً من الإعدادات.</li><li>سهم ↩ يتراجع عن أي خطوة، وسهم ↪ يُعيدها.</li><li>🔒 «قفل التعديل» يمنع تغيير الدرجات أثناء التصفح.</li><li>لا يُلصق هيكل جدول على شعبة فيها درجات أو هيكلة.</li><li>الحذف النهائي يطلب تأكيداً، والتحديث يكون يدوياً من هذه الشاشة.</li></ol></details><details class=dg><summary>٢) بنية البرنامج: صف ← شعبة ← طلاب</summary><ol><li>الصفوف ← «+ إضافة» لإنشاء صف.</li><li>اضغط الصف ثم «+ شعبة» لإضافة شعبة.</li><li>أضف الطلاب فردياً أو بلصق قائمة (اسم في كل سطر)، وتُرتّب ألفبائياً إن فعّلت ذلك.</li><li>حدّد طلاباً لنقلهم أو أرشفتهم أو حذفهم أو كتابة ملاحظة عليهم.</li><li>لكل صف لون تختاره، ويمكن تحريك الصفوف والشعب بـ ▲▼.</li></ol></details><details class=dg><summary>٣) السجلات: يومي ← شهري ← وسطي</summary><ol><li>اليومي: خانات تضيفها أنت، والتاريخ يُكتب يدوياً (لا يُوضع تلقائياً).</li><li>الشهري: أشهر لكل نصف، ولكل شهر خانات أو درجة مباشرة للمواد البسيطة. مجموع اليومي يُضاف من تحت كل شهر.</li><li>الوسطي: النصف الأول، نصف السنة، النصف الثاني، السعي، نهاية السنة، الدرجة النهائية، الدور الثاني.</li></ol></details><details class=dg><summary>٤) كتابة الدرجات: غائب وغش</summary><ol><li>كتابة <b>00</b> تصير «غائب»، و<b>000</b> تصير «غش»، وكلاهما يُحسب <b>صفراً</b> في الجموع.</li><li>لا يقبل الحقل رقماً أكبر من الدرجة المكتوبة أعلى الخانة.</li><li>في «طلابنا» تظهر حالات الغياب والغش وينقلك الضغط على الاسم إلى خانته.</li></ol></details><details class=dg><summary>٥) المجاميع والقسمة</summary><ol><li>مجموع الشهر = مجموع درجات خاناته (أو الدرجة المباشرة).</li><li>النصف = معدل أشهره، السعي السنوي = (النصف الأول + نصف السنة + النصف الثاني) ÷ 3، النهائية = (السعي + نهاية السنة) ÷ 2، النهائية الأخيرة = (السعي + الدور الثاني) ÷ 2. الكسر 0.5 فأكثر يُجبر.</li><li>الجامع اليدوي: تختار أي عناصر وتختار مجموع أو معدل أو «مجموع ÷ رقم»، وهو من «أعمدة الجدول».</li><li>⚠️ انتبه للمجاميع النهائية: بعضها يقسم على 2 وبعضها على 3 وبعضها لا يقسم، حرّرها يدوياً.</li></ol></details><details class=dg><summary>٦) النسبة المئوية</summary><ol><li>نسبة النجاح = عدد من بلغوا حدّ النجاح (افتراضي 50% من العظمى) ÷ الأساس × 100، برقمين بعد الفاصلة.</li><li>الأساس: مجموع طلبة الشعبة، أو عدد المشتركين في الامتحان (لا يُعدّ الغائب مشتركاً).</li><li>من زر «📊 النسبة المئوية» في الشهري تختار خانة أو عدة خانات، وتظهر النسبة أسفل كل خانة وتتحدث مباشرة.</li></ol></details><details class=dg><summary>٧) الطباعة والتصدير</summary><ol><li>الورقة A4 افتراضياً ويمكن تغييرها، والغلاف اختياري، والتواريخ لا تُطبع إلا بموافقتك.</li><li>حقوق البرنامج لا تظهر في الطباعة، يظهر اسم الأستاذ فقط.</li></ol></details><details class=dg><summary>٨) الصوت والكاميرا (تنبيهات)</summary><ol><li>الميكروفون والكاميرا قد يمنعهما العرض المدمج، ويعملان غالباً في النسخة المثبتة.</li><li>راجع كل درجة قبل اعتمادها، فلا يُحفظ شيء تلقائياً.</li></ol></details>`,FEA=`<details class=dg><summary>١) التحكم الكامل بهيكل الجدول (الأهم)</summary><ol><li>أعمدة من إنشائك: جوامع تجمع وتقسم وتعدّل، وخانات إدخال، وأشهر لكل نصف.</li><li>نسخ هيكل الجدول بكل خصائصه إلى شعب أخرى بلا أسماء ولا درجات.</li><li>تلوين وإخفاء لكل عمود أو شهر أو فصل كامل.</li></ol></details><details class=dg><summary>٢) الحماية والأمان</summary><ol><li>تراجع وإعادة على كل شيء، وقفل السجلات، ونسخ احتياطي كملف، وحماية الشعب من الصق الخاطئ.</li><li>تظليل صف الطالب عند التعديل لتجنّب خطأ الصف، ومنع الدرجة الأكبر من العظمى.</li></ol></details><details class=dg><summary>٣) الإدخال السريع بالصوت والكاميرا</summary><ol><li>🎤 الصوت (لهجة عراقية ar-IQ): وضع «اسم فقط» يعرض بيانات الطالب دون تعديل، ووضع «اسم + درجة» يجهّز الدرجة لعمود أو عمودين تختارهما، ويُعرض الاسم والدرجة لاعتمادها أو إلغائها.</li><li>يفهم أرقاماً مثل «خمسة وعشرين» و«تمانية عشر» و«عشرة ونص» والأرقام بالعربية والإنجليزية، ويتسامح مع فروق النطق في الأسماء.</li><li>ينبّهك عند تشابه الأسماء وعند وجود درجة مسبقة، وفيه زر تراجع عن آخر إدخال صوتي.</li><li>📷 الكاميرا المباشرة: تقرأ أسماء ودرجات الورقة بلا تصوير، وتعرض مؤشر const APP_VERSION='1.15.0';

}catch(e){toast(String(e.message)=='stale'?'الملفات الجديدة لم تصل بعد، انتظر دقائق وأعد المحاولة':'تعذر التحديث، تحقق من الإنترنت');return}
